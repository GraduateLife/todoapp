name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  autofix-or-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Auto-fix changed files
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        env:
          LINT_BASE_REF: ${{ github.event.before }}
        run: pnpm lint:changed:fix

      - name: Commit auto-fixes
        id: commit_autofix
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            echo "No auto-fixes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): auto-fix lint"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed auto-fixes, skipping verify in this run."

      - name: Lint changed files
        if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]' || steps.commit_autofix.outputs.pushed != 'true'
        env:
          LINT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: pnpm lint:changed

      - name: Run unit tests
        if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]' || steps.commit_autofix.outputs.pushed != 'true'
        run: pnpm test

      - name: Build app
        if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]' || steps.commit_autofix.outputs.pushed != 'true'
        run: pnpm build
