name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  branch-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint changed files
        env:
          LINT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: pnpm lint:changed

      - name: Run unit tests
        run: pnpm test

      - name: Typecheck integration branches
        if: startsWith(github.ref_name, '20') || startsWith(github.base_ref, '20')
        run: pnpm typecheck

      - name: Build integration branches
        if: startsWith(github.ref_name, '20') || startsWith(github.base_ref, '20')
        run: pnpm build

  mainline-checks:
    if: |
      github.ref_name == 'ci' ||
      github.ref_name == 'main' ||
      github.base_ref == 'ci' ||
      github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all files
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build app
        run: pnpm build
